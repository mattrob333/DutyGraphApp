name: Native builds
on:
  # Pushing a tag such as android-demo-1 builds the mock-data demo APK.
  push:
    tags: ["android-demo-*"]
  workflow_dispatch:
    inputs:
      data_source:
        description: "mock (fictional demo data, no server) or http"
        default: mock
        type: choice
        options: [mock, http]
      api_base_url:
        description: "DutyGraph origin for employee questions (http only)"
        default: https://dutygraph.com
      meetings_api_base_url:
        description: "Meetings/voice server origin (http only; blank turns advisor tools off)"
        default: ""
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_DATA_SOURCE: ${{ inputs.data_source || 'mock' }}
      EXPO_PUBLIC_COMPANION_SCOPE: full
      EXPO_PUBLIC_API_BASE_URL: ${{ inputs.api_base_url }}
      EXPO_PUBLIC_MEETINGS_API_BASE_URL: ${{ inputs.meetings_api_base_url }}
      EXPO_PUBLIC_FACILITATOR_REALTIME: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm ci
        working-directory: mobile
      - run: npx expo prebuild --platform android --no-install
        working-directory: mobile
      # Release bundles the JavaScript into the APK so it runs without a development server.
      # Expo's template signs release with the debug key: fine to sideload, not for the Play Store.
      - run: ./gradlew :app:assembleRelease --no-daemon
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: dutygraph-android-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
  ios:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_DATA_SOURCE: mock
      EXPO_PUBLIC_COMPANION_SCOPE: full
      EXPO_PUBLIC_FACILITATOR_REALTIME: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm ci
        working-directory: mobile
      - run: npx expo prebuild --platform ios --no-install
        working-directory: mobile
      - run: pod install
        working-directory: mobile/ios
      - name: Compile unsigned simulator app
        working-directory: mobile/ios
        run: xcodebuild -workspace DutyGraphCompanion.xcworkspace -scheme DutyGraphCompanion -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
