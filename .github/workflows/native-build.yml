name: Native development build checks
on:
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_DATA_SOURCE: mock
      EXPO_PUBLIC_COMPANION_SCOPE: full
      EXPO_PUBLIC_FACILITATOR_REALTIME: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm ci
        working-directory: mobile
      - run: npx expo prebuild --platform android --no-install
        working-directory: mobile
      - run: ./gradlew :app:assembleDebug --no-daemon
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: mobile/android/app/build/outputs/apk/debug/*.apk
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_DATA_SOURCE: mock
      EXPO_PUBLIC_COMPANION_SCOPE: full
      EXPO_PUBLIC_FACILITATOR_REALTIME: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm ci
        working-directory: mobile
      - run: npx expo prebuild --platform ios --no-install
        working-directory: mobile
      - run: pod install
        working-directory: mobile/ios
      - name: Compile unsigned simulator app
        working-directory: mobile/ios
        run: xcodebuild -workspace DutyGraphCompanion.xcworkspace -scheme DutyGraphCompanion -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
