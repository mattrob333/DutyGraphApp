name: Mobile and API checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - run: npm ci
      - run: npm run test:shared && npm run typecheck:shared
      - run: npm ci
        working-directory: mobile
      - run: npm run verify -- --runInBand
        working-directory: mobile
      - run: npm run export:web
        working-directory: mobile
      - run: npm ci && npm run verify
        working-directory: dev-server
        if: hashFiles('dev-server/package-lock.json') != ''
